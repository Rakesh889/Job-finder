<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #0d9488; --primary-dark: #0f766e;
    --text: #0f172a; --text-light: #64748b; --border: #e2e8f0; --surface: #ffffff;
    --shadow: 0 2px 8px rgba(15,23,42,0.05), 0 10px 26px rgba(15,23,42,0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(160deg, #f0fdfa 0%, #f4f6f9 55%, #eef2ff 100%);
    color: var(--text); padding: 40px 20px 70px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
  .subtitle { color: var(--text-light); font-size: 0.92rem; margin: 0 0 24px; }
  .subtitle a { color: var(--primary); }

  .search-card {
    background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
    border: 1px solid rgba(15,23,42,0.05); padding: 20px; margin-bottom: 20px;
  }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type="text"], select {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    font-family: inherit; font-size: 0.88rem; background: #fff;
  }
  input[type="text"] { flex: 2; min-width: 200px; }
  select { flex: 1; min-width: 130px; }
  button {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none;
    padding: 10px 22px; border-radius: 10px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
    font-family: inherit; box-shadow: 0 4px 14px rgba(13,148,136,0.3);
  }
  button:hover { filter: brightness(1.05); }

  .meta-row { color: var(--text-light); font-size: 0.82rem; margin-bottom: 14px; }

  .job-list { display: flex; flex-direction: column; gap: 12px; }
  .job-card {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .job-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; flex-wrap: wrap; }
  .job-title { font-weight: 700; font-size: 1.02rem; }
  .job-title a { color: var(--text); text-decoration: none; }
  .job-title a:hover { color: var(--primary); }
  .job-company { color: var(--text-light); font-size: 0.86rem; margin-top: 2px; }
  .job-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .badge {
    background: #ccfbf1; color: #0f766e; font-size: 0.72rem; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; text-transform: capitalize;
  }
  .badge.remote { background: #dbeafe; color: #1d4ed8; }
  .job-posted { color: var(--text-light); font-size: 0.76rem; white-space: nowrap; }
  .apply-link {
    display: inline-block; margin-top: 12px; font-size: 0.85rem; font-weight: 700;
    color: var(--primary-dark); text-decoration: none;
  }
  .apply-link:hover { text-decoration: underline; }

  .empty, .error { text-align: center; color: var(--text-light); padding: 40px 0; font-size: 0.9rem; }
  .error { color: #dc2626; }

  .load-more { display: flex; justify-content: center; margin-top: 18px; }
  .load-more button { background: none; color: var(--primary-dark); box-shadow: none; border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔎 Job Finder</h1>
  <p class="subtitle">Searching live postings via <a href="https://freehire.me" target="_blank" rel="noopener">freehire.me</a>'s public API — real jobs straight from company career pages.</p>

  <div class="search-card">
    <div class="search-row">
      <input type="text" id="qInput" placeholder="Job title, skill, or keyword (e.g. node.js, go, product manager)" />
      <select id="workMode">
        <option value="">Any work mode</option>
        <option value="remote">Remote</option>
        <option value="hybrid">Hybrid</option>
        <option value="onsite">On-site</option>
      </select>
      <select id="seniority">
        <option value="">Any seniority</option>
        <option value="intern">Intern</option>
        <option value="junior">Junior</option>
        <option value="middle">Middle</option>
        <option value="senior">Senior</option>
        <option value="lead">Lead</option>
        <option value="staff">Staff</option>
        <option value="principal">Principal</option>
      </select>
      <button id="searchBtn">Search</button>
    </div>
  </div>

  <div id="metaRow" class="meta-row"></div>
  <div id="jobList" class="job-list"></div>
  <div id="loadMoreWrap" class="load-more" style="display:none;">
    <button id="loadMoreBtn">Load more</button>
  </div>
</div>

<script>
const qInput = document.getElementById('qInput');
const workMode = document.getElementById('workMode');
const seniority = document.getElementById('seniority');
const searchBtn = document.getElementById('searchBtn');
const metaRow = document.getElementById('metaRow');
const jobList = document.getElementById('jobList');
const loadMoreWrap = document.getElementById('loadMoreWrap');
const loadMoreBtn = document.getElementById('loadMoreBtn');

const PAGE_SIZE = 20;
let offset = 0;
let currentJobs = [];

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (days <= 0) return 'today';
  if (days === 1) return '1 day ago';
  if (days < 30) return `${days} days ago`;
  return new Date(iso).toLocaleDateString();
}

function salaryLine(e) {
  if (!e || (!e.salary_min && !e.salary_max)) return '';
  const cur = e.salary_currency || '';
  const parts = [];
  if (e.salary_min) parts.push(e.salary_min.toLocaleString());
  if (e.salary_max) parts.push(e.salary_max.toLocaleString());
  return `${cur} ${parts.join('–')}${e.salary_period ? '/' + e.salary_period : ''}`;
}

function renderJobs(jobs, append) {
  const cards = jobs.map(job => {
    const e = job.enrichment || {};
    const sal = salaryLine(e);
    return `
      <div class="job-card">
        <div class="job-top">
          <div>
            <div class="job-title"><a href="${job.url}" target="_blank" rel="noopener">${escapeHtml(job.title)}</a></div>
            <div class="job-company">${escapeHtml(job.company)} · ${escapeHtml(job.location || '')}</div>
          </div>
          <div class="job-posted">${timeAgo(job.posted_at)}</div>
        </div>
        <div class="job-badges">
          ${job.work_mode ? `<span class="badge ${job.work_mode === 'remote' ? 'remote' : ''}">${job.work_mode}</span>` : ''}
          ${e.seniority ? `<span class="badge">${e.seniority}</span>` : ''}
          ${e.category ? `<span class="badge">${e.category.replace(/_/g, ' ')}</span>` : ''}
          ${sal ? `<span class="badge">${sal}</span>` : ''}
        </div>
        <a class="apply-link" href="${job.url}" target="_blank" rel="noopener">View &amp; apply →</a>
      </div>
    `;
  }).join('');

  if (append) {
    jobList.insertAdjacentHTML('beforeend', cards);
  } else {
    jobList.innerHTML = cards;
  }
}

async function search(reset) {
  if (reset) { offset = 0; currentJobs = []; jobList.innerHTML = ''; }

  const params = new URLSearchParams();
  if (qInput.value.trim()) params.set('q', qInput.value.trim());
  if (workMode.value) params.set('work_mode', workMode.value);
  if (seniority.value) params.set('seniority', seniority.value);
  params.set('limit', PAGE_SIZE);
  params.set('offset', offset);

  metaRow.textContent = 'Searching...';
  loadMoreWrap.style.display = 'none';

  try {
    const res = await fetch(`/api/search?${params.toString()}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Search failed');

    const jobs = data.data || [];
    currentJobs = currentJobs.concat(jobs);
    renderJobs(jobs, offset > 0);

    const total = data.meta?.total || 0;
    metaRow.textContent = total ? `${total.toLocaleString()} jobs found` : '';
    if (!currentJobs.length) {
      jobList.innerHTML = '<div class="empty">No jobs matched — try a broader search.</div>';
    }

    offset += jobs.length;
    loadMoreWrap.style.display = (jobs.length === PAGE_SIZE && offset < total) ? 'flex' : 'none';
  } catch (err) {
    metaRow.textContent = '';
    jobList.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  }
}

searchBtn.addEventListener('click', () => search(true));
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(true); });
loadMoreBtn.addEventListener('click', () => search(false));

search(true);
</script>
</body>
</html>
